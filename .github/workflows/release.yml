name: Create release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create zip package
        run: zip doubles_tournament_v1.zip index.html README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: doubles_tournament_v1.zip
          generate_release_notes: true
